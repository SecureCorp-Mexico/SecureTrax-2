# SecureTrax-2 dev MQTT broker.
# Production deployments will swap this for a TLS+mTLS profile (see Phase 0
# security/compliance). Anonymous-allow stays for local dev only.

listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type all
